<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataMuse</title>
<style>
  :root {
    --bg:#FBF7F1; --card:#fff; --line:#E7DDD3; --ink:#302A26; --ink2:#594D44; --mute:#8A8179;
    --accent:#D96B3B; --user:#EADDD1; --soft:#F2E9DF; --err-bg:#FCEEEC; --err:#7A3B34; --err-line:#C9564A;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:850px; margin:0 auto; padding:56px 16px 140px; }
  .brand { text-align:center; font-weight:600; color:#4A4038; margin-bottom:48px; }
  .brand span, h1 span { color:var(--accent); }
  h1 { text-align:center; font:400 clamp(34px,7vw,52px)/1.1 Georgia,serif; margin:0 0 14px; }
  .sub { text-align:center; color:var(--mute); margin-bottom:36px; }
  .drop { background:var(--card); border:2px dashed var(--line); border-radius:20px; padding:36px 24px; text-align:center; cursor:pointer; transition:.15s; }
  .drop:hover, .drop.over { border-color:var(--accent); background:#FFF9F4; }
  .drop b { display:block; font-size:20px; margin-bottom:6px; }
  .drop small { color:var(--mute); }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:10px 18px; font:inherit; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--ink2); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:default; }
  .center { text-align:center; margin-top:18px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; }
  .bar { height:10px; background:var(--soft); border-radius:99px; overflow:hidden; margin:14px 0 8px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
  .bar.indet i { width:35%; animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
  .meta { display:flex; justify-content:space-between; gap:12px; color:var(--mute); font-size:14px; flex-wrap:wrap; }
  .ready { background:var(--soft); border-radius:15px; padding:14px 18px; text-align:center; color:var(--ink2); margin-bottom:10px; }
  .desc { text-align:center; color:var(--mute); font-size:13px; margin-bottom:24px; }
  .msg { margin:14px 0; }
  .user { background:var(--user); padding:12px 16px; border-radius:18px 18px 4px 18px; margin-left:auto; width:fit-content; max-width:80%; white-space:pre-wrap; overflow-wrap:anywhere; }
  .ai { background:var(--card); border:1px solid var(--line); padding:15px 18px; border-radius:18px 18px 18px 4px; max-width:92%; overflow-wrap:anywhere; }
  .ai.clarify { border-color:var(--accent); background:#FFF6EF; }
  .ai.error { border-color:var(--err-line); background:var(--err-bg); color:var(--err); }
  .ai p { margin:0 0 10px; } .ai p:last-child { margin:0; }
  .ai table { border-collapse:collapse; width:100%; margin:10px 0; font-size:14px; display:block; overflow-x:auto; }
  .ai th,.ai td { border:1px solid var(--line); padding:6px 12px; text-align:left; }
  .ai th { background:var(--bg); }
  .ai ul,.ai ol { margin:6px 0 10px 20px; padding:0; }
  .ai pre { white-space:pre-wrap; }
  .dots::after { content:""; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  .composer { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent,var(--bg) 35%); padding:28px 16px 18px; }
  .composer form { max-width:850px; margin:0 auto; display:flex; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px; }
  .composer input { flex:1; border:0; outline:0; font:inherit; padding:8px 10px; background:transparent; color:inherit; min-width:0; }
  .hidden { display:none !important; }
  .err-box { background:var(--err-bg); border:1px solid var(--err-line); color:var(--err); border-radius:12px; padding:12px 16px; margin:16px 0; }
  .top-actions { text-align:center; margin-bottom:22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">✦ <span>DataMuse</span></div>

  <!-- 1. choose a file -->
  <section id="s-pick">
    <h1>Ask your <span>data</span><br>anything.</h1>
    <div class="sub">Upload your data and ask questions in plain English.</div>
    <div id="pickError" class="err-box hidden"></div>
    <label class="drop" id="drop">
      <b>Bring your data</b>
      <small id="allowedText">CSV, Excel, JSON or Parquet · files of several GB are fine</small>
      <input id="file" type="file" hidden>
    </label>
    <div class="center"><button id="useDefault" class="btn ghost hidden">Use the default database instead</button></div>
  </section>

  <!-- 2. uploading / loading -->
  <section id="s-load" class="hidden">
    <h1 id="loadTitle">Uploading <span>your data</span></h1>
    <div class="sub" id="loadFile"></div>
    <div class="panel">
      <div id="loadStage" style="font-weight:600">Uploading…</div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="meta"><span id="loadLeft"></span><span id="loadRight"></span></div>
    </div>
    <div id="loadError" class="err-box hidden"></div>
    <div class="center"><button id="cancelLoad" class="btn ghost">Cancel</button></div>
  </section>

  <!-- 3. chat -->
  <section id="s-chat" class="hidden">
    <h1>Your data is <span>ready.</span></h1>
    <div class="sub" id="chatFile"></div>
    <div class="ready">✓ Your file is ready to explore</div>
    <div class="desc" id="chatDesc"></div>
    <div class="top-actions"><button id="newFile" class="btn ghost">Upload a different file</button></div>
    <div id="log"></div>
  </section>
</div>

<div class="composer hidden" id="composer">
  <form id="form">
    <input id="q" placeholder="Ask your data..." autocomplete="off">
    <button class="btn" id="send">Send</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" onerror="void 0"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" onerror="void 0"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let cfg = { chunk_bytes: 8 * 1024 * 1024, allowed_ext: [], default_available: false };
let sid = null, awaitingClarify = false, busy = false, cancelled = false, activeXhrs = new Set();

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

function show(which) {
  for (const id of ["s-pick", "s-load", "s-chat"]) $(id).classList.toggle("hidden", id !== which);
  $("composer").classList.toggle("hidden", which !== "s-chat");
}
const fmtBytes = n => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : (n / 1e3).toFixed(0) + " KB";
const fmtTime = s => { s = Math.round(s); return s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s"; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && data.detail) || `Request failed (${r.status})`);
  return data;
}

/* ---------- rendering ---------- */
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function renderMarkdown(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  return "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>";     // safe fallback if the CDN is unreachable
}
function addMsg(role, text, kind) {
  const d = document.createElement("div");
  d.className = "msg";
  const b = document.createElement("div");
  if (role === "user") { b.className = "user"; b.textContent = text; }
  else { b.className = "ai" + (kind ? " " + kind : ""); b.innerHTML = renderMarkdown(text); }
  d.appendChild(b); $("log").appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

/* ---------- upload ---------- */
function xhrPut(url, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    activeXhrs.add(x);
    x.open("PUT", url);
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded);
    x.onload = () => { activeXhrs.delete(x); x.status < 300 ? resolve() : reject(new Error(x.responseText || x.status)); };
    x.onerror = () => { activeXhrs.delete(x); reject(new Error("network error")); };
    x.onabort = () => { activeXhrs.delete(x); reject(new Error("cancelled")); };
    x.send(blob);
  });
}

function setBar(pct) { $("bar").classList.remove("indet"); $("barFill").style.width = pct + "%"; }
function setIndeterminate() { $("bar").classList.add("indet"); $("barFill").style.width = ""; }
function loadError(msg) { $("loadError").textContent = msg; $("loadError").classList.remove("hidden"); $("cancelLoad").textContent = "Back"; }

async function startUpload(file) {
  cancelled = false;
  $("loadError").classList.add("hidden"); $("cancelLoad").textContent = "Cancel";
  $("loadTitle").innerHTML = "Uploading <span>your data</span>";
  $("loadFile").textContent = `${file.name} · ${fmtBytes(file.size)}`;
  $("loadStage").textContent = "Uploading…"; setBar(0);
  show("s-load");

  try {
    const init = await api("POST", "/upload/init", { filename: file.name, size: file.size });
    sid = init.session_id;
    const chunk = init.chunk_bytes, total = init.chunks;
    const sent = new Array(total).fill(0);            // bytes sent per chunk (live)
    const t0 = performance.now();
    let next = 0;

    const refresh = () => {
      const done = sent.reduce((a, b) => a + b, 0);
      const secs = (performance.now() - t0) / 1000;
      const rate = done / Math.max(secs, 0.5);
      setBar(Math.min(100, done / file.size * 100));
      $("loadLeft").textContent = `${fmtBytes(done)} of ${fmtBytes(file.size)}`;
      $("loadRight").textContent = `${fmtBytes(rate)}/s · ~${fmtTime((file.size - done) / Math.max(rate, 1))} left`;
    };

    async function worker() {                            // 3 workers upload chunks in parallel
      while (!cancelled) {
        const i = next++; if (i >= total) return;
        const blob = file.slice(i * chunk, Math.min(file.size, (i + 1) * chunk));
        for (let attempt = 1; ; attempt++) {              // a failed chunk is simply re-sent
          try { await xhrPut(`/upload/${sid}/chunk?index=${i}`, blob, n => { sent[i] = n; refresh(); }); sent[i] = blob.size; refresh(); break; }
          catch (e) { sent[i] = 0; if (cancelled) return; if (attempt >= 5) throw e; await sleep(600 * attempt); }
        }
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    if (cancelled) return;

    await api("POST", `/upload/${sid}/complete`);
    $("loadTitle").innerHTML = "Preparing <span>your data</span>";
    setIndeterminate(); $("loadRight").textContent = "";
    while (!cancelled) {                                   // poll ingestion progress
      const s = await api("GET", `/session/${sid}`);
      $("loadStage").textContent = s.stage || "Working…";
      $("loadLeft").textContent = s.elapsed_s != null ? `${fmtTime(s.elapsed_s)} elapsed` : "";
      if (s.phase === "ready") { enterChat(file.name, s.description); store.set("dm_sid", sid); return; }
      if (s.phase === "error") { setBar(0); loadError(s.error || "Couldn't read that file."); return; }
      await sleep(1000);
    }
  } catch (e) {
    if (!cancelled) loadError(e.message || String(e));
  }
}

function enterChat(name, desc) {
  $("chatFile").textContent = name || "";
  $("chatDesc").textContent = desc || "";
  $("log").innerHTML = ""; awaitingClarify = false; busy = false;
  show("s-chat"); $("q").placeholder = "Ask your data..."; $("q").focus();
}

function resetAll() {
  cancelled = true; activeXhrs.forEach(x => x.abort());
  if (sid) fetch(`/session/${sid}`, { method: "DELETE" }).catch(() => {});
  sid = null; store.set("dm_sid", null);
  $("file").value = ""; show("s-pick");
}

/* ---------- asking ---------- */
async function pollStatus() {
  const t0 = Date.now();
  while (Date.now() - t0 < 15 * 60 * 1000) {
    const d = await api("GET", `/status/${sid}`);
    if (d.status !== "processing") return d;
    await sleep(1000);
  }
  return { status: "timeout" };
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = $("q").value.trim();
  if (!text || busy || !sid) return;
  $("q").value = ""; busy = true; $("send").disabled = true;
  addMsg("user", text);
  const thinking = addMsg("ai", "Thinking<span class='dots'></span>");
  try {
    if (awaitingClarify) await api("POST", "/clarify", { session_id: sid, answer: text });
    else await api("POST", "/ask", { session_id: sid, question: text });
    const r = await pollStatus();
    thinking.remove();
    if (r.status === "needs_clarification") { addMsg("ai", r.question || "Could you clarify?", "clarify"); awaitingClarify = true; $("q").placeholder = "Type your answer..."; }
    else if (r.status === "done") { addMsg("ai", r.answer || "I couldn't produce an answer for that."); awaitingClarify = false; $("q").placeholder = "Ask your data..."; }
    else if (r.status === "timeout") { addMsg("ai", "This is taking longer than expected. Please try again in a moment.", "error"); awaitingClarify = false; }
    else { addMsg("ai", "Sorry, I ran into a problem: " + (r.error || "something went wrong."), "error"); awaitingClarify = false; $("q").placeholder = "Ask your data..."; }
  } catch (e) {
    thinking.remove(); awaitingClarify = false;
    addMsg("ai", "Sorry, that didn't work: " + (e.message || e), "error");
  } finally { busy = false; $("send").disabled = false; $("q").focus(); }
});

/* ---------- wiring ---------- */
$("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) pick(f); });
const drop = $("drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) pick(f); });
$("cancelLoad").addEventListener("click", resetAll);
$("newFile").addEventListener("click", resetAll);
$("useDefault").addEventListener("click", async () => {
  try { const r = await api("POST", "/session/default"); sid = r.session_id; enterChat("Default database", r.description); store.set("dm_sid", sid); }
  catch (e) { showPickError(e.message); }
});
function showPickError(m) { $("pickError").textContent = m; $("pickError").classList.remove("hidden"); }
function pick(file) {
  $("pickError").classList.add("hidden");
  const ext = "." + file.name.split(".").pop().toLowerCase();
  if (cfg.allowed_ext.length && !cfg.allowed_ext.includes(ext)) return showPickError(`Unsupported file type ${ext}. Supported: ${cfg.allowed_ext.join(", ")}`);
  startUpload(file);
}

(async function boot() {
  try { cfg = await api("GET", "/config"); } catch { showPickError("Can't reach the server. Is it running?"); }
  if (cfg.default_available) $("useDefault").classList.remove("hidden");
  if (cfg.allowed_ext.length) $("file").accept = cfg.allowed_ext.join(",");
  const saved = store.get("dm_sid");                    // survive a page refresh
  if (saved) {
    try { const s = await api("GET", `/session/${saved}`); if (s.phase === "ready") { sid = saved; enterChat(s.filename, s.description); } else store.set("dm_sid", null); }
    catch { store.set("dm_sid", null); }
  }
})();
</script>
</body>
</html>
